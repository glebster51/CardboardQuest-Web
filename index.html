<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#c7b391">
  <title>CardboardQuest</title>
  <link rel="stylesheet" href="style.css?v=88">
  <link rel="stylesheet" href="editor/editor.css?v=144">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main id="scene" aria-label="Игровой стол. Перетаскивай героя для атаки, а пустое место — для вращения камеры."></main>
  <div id="location-info" role="status" aria-live="polite"><strong id="location-title"></strong><small id="location-detail"></small></div>
  <nav id="hud-tools" aria-label="Игровые действия">
    <button id="inventory-toggle" class="hud-icon" type="button" aria-label="Рюкзак" aria-controls="inventory-panel" aria-haspopup="dialog" aria-expanded="false" title="Рюкзак">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <g stroke="#4b3020" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13V9c0-6 12-6 12 0v4" fill="none"/>
          <path d="M12 22H8v14c0 3 3 4 6 3m22-17h4v14c0 3-3 4-6 3" fill="#985631"/>
          <path d="M12 17c0-9 24-9 24 0l2 21c1 7-29 7-28 0z" fill="#b9753d"/>
          <path d="M12 16c0-5 24-5 24 0v8c-6 5-18 5-24 0z" fill="#dfad61"/>
          <path d="M17 32h14v9H17z" fill="#e9bf7e"/>
          <path d="M21 22h6v9h-6z" fill="#f7d88a"/>
          <path d="M24 26v2M20 36h8" fill="none"/>
        </g>
      </svg>
      <span id="inventory-count" class="hud-count" hidden aria-hidden="true"></span>
    </button>
    <button id="audio-toggle" class="hud-icon" type="button" aria-label="Настройки" aria-controls="audio-panel" aria-haspopup="dialog" aria-expanded="false" title="Настройки">
      <img src="assets/ui/settings-gear.webp" width="46" height="46" alt="" decoding="async">
    </button>
    <button id="map-toggle" class="hud-icon" type="button" aria-label="Карта" aria-controls="world-map" aria-haspopup="dialog" aria-expanded="false" title="Карта">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <g stroke="#4b3020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 10 12-4 14 5 12-4v32l-12 4-14-5-12 4z" fill="#f3d99d"/>
          <path d="m17 6 14 5v32l-14-5z" fill="#d8bb7c" stroke="none"/>
          <path d="M17 6v32m14-27v32" fill="none" stroke="#a17c49" stroke-width="1.8"/>
          <path d="m9 18 5-3 5 5m14 12 5-3 2 2" fill="none" stroke="#789451" stroke-width="3.5"/>
          <path d="M12 32c9-1 5-12 14-10 5 1 4-6 10-7" fill="none" stroke="#a45b36" stroke-width="2.3" stroke-dasharray="2.5 4"/>
          <path d="m33 12 6 6m0-6-6 6" fill="none" stroke="#9c4930"/>
          <circle cx="12" cy="32" r="2.7" fill="#748d46"/>
        </g>
      </svg>
    </button>
    <button id="scene-editor-toggle" class="hud-icon scene-editor-toggle" type="button" aria-label="Открыть редактор сцены" aria-pressed="false" title="Редактор сцены — ~">
      <span aria-hidden="true">~</span>
    </button>
  </nav>
  <div id="story-actions">
    <button id="interact" type="button" hidden>Осмотреть</button>
  </div>
  <section id="story-dialogue" hidden role="dialog" aria-modal="true" aria-labelledby="story-title" tabindex="-1">
    <article>
      <img id="story-portrait" alt="" hidden>
      <div id="story-copy">
      <strong id="story-title"></strong>
      <strong id="story-speaker"></strong>
      <p id="story-text"></p>
      <small id="story-progress"></small>
      <div id="story-options"></div>
      <button id="story-close" type="button">Дальше →</button>
      </div>
    </article>
  </section>
  <section id="inventory-panel" hidden role="dialog" aria-modal="true" aria-labelledby="inventory-title">
    <article class="inventory-sheet">
      <header class="inventory-heading">
        <div><h2 id="inventory-title">Дорожный мешок</h2><span id="inventory-equipment"></span></div>
        <button id="inventory-close" type="button" aria-label="Закрыть рюкзак">×</button>
      </header>
      <div class="inventory-board">
        <div id="inventory-items" role="group" aria-label="Предметы в рюкзаке, пять на пять ячеек"></div>
      </div>
      <footer class="inventory-bag">
        <img id="inventory-backpack" alt="" aria-hidden="true" decoding="async">
        <div class="inventory-bag-label"><strong id="inventory-capacity"></strong><span id="inventory-health" role="img" aria-label="Здоровье"></span></div>
      </footer>
      <p id="inventory-empty" hidden>Пока пусто. Впереди целое приключение.</p>
      <nav id="inventory-pages" hidden aria-label="Страницы рюкзака">
        <button id="inventory-previous" type="button" aria-label="Предыдущие предметы">←</button>
        <span id="inventory-page-label"></span>
        <button id="inventory-next" type="button" aria-label="Следующие предметы">→</button>
      </nav>
      <p id="inventory-notice" role="status" aria-live="polite"></p>
    </article>
    <div id="inventory-tooltip" hidden role="group" aria-labelledby="inventory-item-name">
      <button id="inventory-tooltip-close" type="button" aria-label="Закрыть описание">×</button>
      <strong id="inventory-item-name"></strong>
      <p id="inventory-item-description"></p>
      <span id="inventory-item-effect"></span>
      <button id="inventory-use" type="button" hidden>Использовать</button>
    </div>
  </section>
  <section id="world-map" hidden role="dialog" aria-modal="true" aria-labelledby="world-map-title">
    <article>
      <header>
        <div><strong id="world-map-title">Дороги долины</strong><small id="world-map-progress"></small></div>
        <button id="world-map-close" type="button" aria-label="Закрыть карту">×</button>
      </header>
      <div id="world-map-viewport"><svg id="world-map-graph" role="img"></svg></div>
      <footer><span><i class="map-key current"></i>Ты здесь</span><span><i class="map-key visited"></i>Был здесь</span><span><i class="map-key"></i>Впереди</span></footer>
    </article>
  </section>
  <section id="audio-panel" hidden role="dialog" aria-modal="true" aria-labelledby="audio-title">
    <header><h2 id="audio-title">Настройки</h2><button id="audio-close" type="button" aria-label="Закрыть настройки">×</button></header>
    <label for="audio-master">Общая громкость <output id="audio-master-value"></output></label>
    <input id="audio-master" data-audio-setting="master" type="range" min="0" max="100" step="1">
    <label for="audio-music">Музыка <output id="audio-music-value"></output></label>
    <input id="audio-music" data-audio-setting="music" type="range" min="0" max="100" step="1">
    <label for="audio-effects">Игровые звуки <output id="audio-effects-value"></output></label>
    <input id="audio-effects" data-audio-setting="effects" type="range" min="0" max="100" step="1">
    <label for="audio-ambience">Звуки природы <output id="audio-ambience-value"></output></label>
    <input id="audio-ambience" data-audio-setting="ambience" type="range" min="0" max="100" step="1">
    <button id="audio-mute" type="button" aria-pressed="false">Выключить звук</button>
    <button id="restart" type="button" aria-label="Начать игру заново" title="Начать игру заново">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <g stroke="#4b3020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M35 14a16 16 0 1 1-22 0l-4-4 16-2-3 16-4-5a9 9 0 1 0 12 0z" fill="#82964f"/>
          <path d="m12 12 9-1-2 9M35 27a11 11 0 0 1-8 9" fill="none" stroke="#c4d18b" stroke-width="1.8"/>
        </g>
      </svg>
      <span>Начать заново</span>
    </button>
    <small id="audio-credit">Музыка: Suno · звуковые эффекты: CardboardQuest</small>
  </section>
  <div id="loading" role="status" aria-label="Загрузка"><span></span></div>
  <div id="error" role="alert" hidden></div>
  <script type="module" src="app.js?v=192"></script>
</body>
</html>
