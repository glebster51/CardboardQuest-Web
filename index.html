<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#c7b391">
  <title>CardboardQuest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="scene" aria-label="Игровой стол. Перетаскивай героя для атаки, а пустое место — для вращения камеры."></main>
  <div id="location-info" role="status" aria-live="polite"><strong id="location-title"></strong><small id="location-detail"></small></div>
  <button id="restart" type="button" aria-label="Начать игру заново">↻ <span>Заново</span></button>
  <div id="story-actions">
    <button id="interact" type="button" hidden>Осмотреть</button>
    <button id="inventory-toggle" type="button">Рюкзак</button>
  </div>
  <section id="story-dialogue" hidden aria-live="polite">
    <article>
      <strong id="story-title"></strong>
      <p id="story-text"></p>
      <div id="story-options"></div>
      <button id="story-close" type="button">Понятно</button>
    </article>
  </section>
  <section id="inventory-panel" hidden aria-live="polite">
    <article>
      <strong>Дорожный мешок</strong>
      <div id="inventory-items"></div>
      <button id="use-food" type="button">Съесть припасы</button>
      <button id="inventory-close" type="button">Закрыть</button>
    </article>
  </section>
  <div id="loading" role="status" aria-label="Загрузка"><span></span></div>
  <div id="error" role="alert" hidden></div>
<script type="module" src="app.js?v=75"></script>
</body>
</html>
