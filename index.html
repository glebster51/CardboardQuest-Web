<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#c7b391">
  <title>CardboardQuest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="scene" aria-label="Игровой стол. Перетаскивай героя для атаки, а пустое место — для вращения камеры."></main>
  <div id="location-info" role="status" aria-live="polite"><strong id="location-title"></strong><small id="location-detail"></small></div>
  <button id="restart" type="button" aria-label="Начать игру заново">↻ <span>Заново</span></button>
  <div id="loading" role="status" aria-label="Загрузка"><span></span></div>
  <div id="error" role="alert" hidden></div>
<script type="module" src="app.js?v=60"></script>
</body>
</html>
