<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#c7b391">
  <title>CardboardQuest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="scene" aria-label="Игровой стол. Оттяни из любой точки экрана и отпусти, чтобы направить атаку героя. Вращай камеру правой кнопкой мыши или двумя пальцами."></main>

  <div id="loading" role="status" aria-label="Загрузка"><span></span></div>
  <div id="error" role="alert" hidden></div>

</body>
