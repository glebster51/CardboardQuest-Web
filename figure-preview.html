<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CardboardQuest — проверка фигурок</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#d7c5a5;color:#352817;font:14px/1.4 system-ui,sans-serif}.top{position:sticky;top:0;z-index:2;padding:14px 20px;background:#eadbbd;border-bottom:1px solid #9b805a;box-shadow:0 2px 10px #48351e22}.top h1{font-size:19px;margin:0 0 3px}.top p{margin:0;color:#66543a}.error{color:#9f2119;font-weight:700}.sheet{display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:1px;padding:1px;background:#8b724e;min-width:900px}.cell{height:232px;position:relative;background:#f0e3c8}.cell canvas{width:100%;height:100%;display:block}.label{position:absolute;left:7px;top:6px;z-index:1;background:#f7eddaea;border-radius:5px;padding:3px 6px;font-size:11px;font-weight:700;pointer-events:none}.view{position:absolute;right:7px;top:6px;background:#3d3326cc;color:#fff6e2;border-radius:5px;padding:3px 6px;font-size:10px;pointer-events:none}.state{position:sticky;left:0;grid-column:1/-1;padding:5px 9px;background:#6e5737;color:white;font-weight:700}.status{padding:12px 20px}.wrap{overflow:auto}
    @media(max-width:700px){.sheet{grid-template-columns:repeat(6,145px)}.top{position:static}}
  </style>
</head>
<body>
  <header class="top"><h1>Проверка фигурок</h1><p>Один и тот же генератор модели, что в игре · 6 состояний × герой и гоблин · спереди, три четверти, сзади</p></header>
  <div id="status" class="status">Загружаю спрайты и строю модели…</div>
  <main class="wrap"><div id="sheet" class="sheet"></div></main>
  <script type="module" src="figure-preview.mjs?v=6"></script>
</body>
</html>
